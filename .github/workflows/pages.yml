name: Deploy preview to GitHub Pages

# Preview of the documentation so it can be reviewed without a local server.
#
# Production is Cloudflare Pages (docs.picstome.com) and uses the same build with
# the default base. This workflow only publishes the same output under
# https://picstome.github.io/docs/, which is why it sets DOCS_SITE and DOCS_BASE.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        env:
          DOCS_SITE: https://picstome.github.io
          DOCS_BASE: /docs
        run: npm run build

      # Pages serves 404.html for unknown paths; the sitemap already lists the
      # canonical production URLs, which is what search engines should index.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
