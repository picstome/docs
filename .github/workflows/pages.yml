name: Deploy documentation

# Publishes the help center to GitHub Pages on every push to main.
#
# The site is served at https://docs.picstome.com from the domain root, so
# DOCS_BASE stays `/`. The custom domain and the HTTPS certificate are configured
# in the repository settings (Settings -> Pages), not here.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        env:
          DOCS_SITE: https://docs.picstome.com
          DOCS_BASE: /
        run: npm run build

      # Pages serves 404.html for unknown paths; without this file Jekyll would
      # also try to process the output.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
